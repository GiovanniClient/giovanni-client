name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: giovanniclient-jars
          path: build/libs/*.jar

      - name: Send release JAR to Discord
        if: github.event_name == 'push' && github.ref == 'refs/heads/26.2'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord upload."
            exit 0
          fi

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$JAR_PATH" ]; then
            echo "No distributable JAR was produced."
            exit 1
          fi

          curl --fail --show-error --silent \
            -F "payload_json={\"content\":\"New GiovanniClient 26.2 build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            -F "files[0]=@${JAR_PATH}" \
            "$DISCORD_WEBHOOK_URL"
